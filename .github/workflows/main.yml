name: sector-monitor

on:
  schedule:
    - cron: "7 */2 * * *"   # 2시간마다 7분 (실제 실행은 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch:       # Actions 탭의 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 이전 데이터 불러오기
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: monitor-cache-${{ github.run_id }}
          restore-keys: monitor-cache-

      - name: 수집·판정·페이지 만들기
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_INVITE_URL: ${{ secrets.TELEGRAM_INVITE_URL }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python monitor.py

      - name: 데이터 보관
        if: always() && hashFiles('cache/cache.json') != ''
        uses: actions/cache/save@v5
        with:
          path: cache
          key: monitor-cache-${{ github.run_id }}

      - name: 기록 저장 (성적표·도미넌스·업비트)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "기록 $(date -u +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
